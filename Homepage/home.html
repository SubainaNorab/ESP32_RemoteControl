<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 Webserver</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f9f9f9;
            padding: 20px;
        }
        .container {
            max-width: 350px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 2px 2px 8px rgba(0, 0, 0, 0.1);
        }
        input[type="number"] {
            width: 60px;
            padding: 6px;
            margin: 5px 10px;
            text-align: center;
        }
        button {
            padding: 10px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }
        button:hover {
            background: #45a049;
        }
        .sensor-data {
            margin-top: 15px;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>ESP32 RGB LED Control</h2>
        <label>Red:</label>
        <input type="number" id="red" min="0" max="255" value="0">
        <label>Green:</label>
        <input type="number" id="green" min="0" max="255" value="0">
        <label>Blue:</label>
        <input type="number" id="blue" min="0" max="255" value="0">
        <br>
        <button onclick="sendRGB()">Set RGB</button>
        <div class="sensor-data">
            <p>Temperature: <span id="temp">--</span>°C</p>
            <p>Humidity: <span id="humidity">--</span>%</p>
        </div>
    </div>
    <script>
        function sendRGB() {
            let r = document.getElementById('red').value;
            let g = document.getElementById('green').value;
            let b = document.getElementById('blue').value;
            fetch(`/setRGB?r=${r}&g=${g}&b=${b}`);
        }

        function updateSensorData() {
            fetch('/sensorData')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('temp').innerText = data.temperature;
                    document.getElementById('humidity').innerText = data.humidity;
                });
        }
        setInterval(updateSensorData, 5000);
    </script>
</body>
</html>
