<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 LED Control</title>
    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }
        h1 {
            color: #333;
        }
        .button-container {
            margin-top: 30px;
        }
        button {
            width: 150px;
            height: 50px;
            font-size: 18px;
            border: none;
            margin: 10px;
            color: white;
            cursor: pointer;
        }
        .red { background-color: red; }
        .blue { background-color: blue; }
        .green { background-color: green; }
        .developer {
            background-color: black;
            color: white;
            font-size: 16px;
        }
        button:hover {
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <h1>ESP32 LED Control</h1>
    <h2>RGB LED Control</h2>
    <input type="number" id="red" placeholder="Red (0-255)">
    <input type="number" id="green" placeholder="Green (0-255)">
    <input type="number" id="blue" placeholder="Blue (0-255)">
    <button onclick="sendRGB()">Set RGB</button>
    
    <h2>Temperature & Humidity</h2>
    <button onclick="fetchDHT()">Get Data</button>
    <p id="dht-data">Waiting for data...</p>
</body>
<script>
    function sendRGB() {
        let r = document.getElementById("red").value;
        let g = document.getElementById("green").value;
        let b = document.getElementById("blue").value;
        
        fetch('/rgb', { method: 'POST', body: `${r},${g},${b}` })
        .then(response => response.text())
        .then(data => alert(data));
    }
    function fetchDHT() {
        fetch('/dht')
        .then(response => response.text())
        .then(data => document.getElementById("dht-data").innerText = data);
    }
</script>
</html>
